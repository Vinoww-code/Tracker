<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONO - Menu</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --text-main: #000000;
            --accent: #000000;
            --border: #000000;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --accent: #ffffff;
            --border: #333333;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: 0.3s ease;
        }

        .logo-section { margin-bottom: 60px; text-align: center; }
        .logo-section h1 { font-size: 3rem; font-weight: 200; letter-spacing: 12px; margin: 0; text-transform: uppercase; }
        .logo-section p { letter-spacing: 4px; text-transform: uppercase; font-size: 0.7rem; color: #666; margin-top: 10px; }

        .menu-options { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 280px; }

        .menu-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 18px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            text-decoration: none;
            color: var(--text-main);
            text-align: center;
        }

        .menu-btn:active { transform: scale(0.98); opacity: 0.8; }
        .menu-btn.primary { background: var(--accent); color: var(--bg-color); }

        .version { margin-top: 40px; font-size: 0.6rem; color: #888; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="logo-section">
        <h1>TrackerdLy</h1>
        <p>Aktivitas & Tracker</p>
    </div>

    <div class="menu-options">
        <a href="tracker.html" class="menu-btn primary">Mulai Tracker</a>
        <button class="menu-btn" onclick="toggleTheme()">Mode Gelap/Terang (🌓)</button>
        <button class="menu-btn" onclick="setupNotification()">Nyalakan Pengingat</button>
    </div>
    
    <p class="version">VERSION 2.0.0</p>

    <script>
        function toggleTheme() {
            const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('mono-theme', theme);
        }

        // Load saved theme
        const savedTheme = localStorage.getItem('mono-theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        function setupNotification() {
            if (!("Notification" in window)) {
                alert("Browser tidak mendukung notifikasi.");
                return;
            }
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    alert("Notifikasi Aktif! Kamu akan diingatkan setiap jam 8 malam.");
                    // Logika pengingat sederhana (hanya simulasi karena browser butuh Service Worker untuk background task)
                }
            });
        }
    </script>
</body>
</html>
