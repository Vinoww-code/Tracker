<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Activity Tracker</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  margin:0;
  padding:15px;
  background:#f2f2f2;
}

h1{
  text-align:center;
  margin-bottom:10px;
}

.toolbar{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:15px;
  flex-wrap:wrap;
}

select{
  padding:6px;
  font-size:14px;
}

.container{
  display:flex;
  background:#000;
  border-radius:15px;
  overflow:hidden;
  min-height:300px;
}

/* ===== SIDEBAR ===== */
.activities{
  width:220px;
  background:#777;
  color:#fff;
  padding:12px;
}

.activities h3{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:0;
}

.activities button{
  background:#111;
  color:#fff;
  border:none;
  padding:5px 10px;
  cursor:pointer;
}

.activities ul{
  list-style:none;
  padding:0;
  margin:0;
}

.activities li{
  background:#666;
  margin-bottom:10px;
  padding:8px;
  border-radius:8px;
}

.delete-btn{
  background:#b00000;
  border:none;
  color:#fff;
  padding:2px 6px;
  font-size:12px;
  cursor:pointer;
  float:right;
}

/* ===== PROGRESS ===== */
.progress{
  height:6px;
  background:#333;
  border-radius:4px;
  overflow:hidden;
  margin-top:5px;
}

.progress-bar{
  height:100%;
  width:0%;
  transition:width .3s;
}

/* ===== GRID ===== */
.grid-wrapper{
  flex:1;
  overflow-x:auto;
  padding:10px;
}

table{
  border-collapse:collapse;
  min-width:900px;
  color:#fff;
}

th,td{
  border:1px solid #aaa;
  text-align:center;
  padding:6px;
}

th{
  background:#666;
  position:sticky;
  top:0;
}

input[type="checkbox"]{
  width:20px;
  height:20px;
}

/* ===== ROW COLOR (PSIKOLOGI) ===== */
.low{ background:#444; }
.mid{ background:#c9a400; }
.good{ background:#2f8f2f; }
.full{ background:#0f5f0f; }

/* ===== SUMMARY ===== */
#summary{
  background:#fff;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
  font-size:14px;
}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  .container{
    flex-direction:column;
  }
  .activities{
    width:100%;
  }
  table{
    min-width:700px;
  }
}
</style>
</head>

<body>

<h1>Activity Tracker</h1>

<div class="toolbar">
  <select id="monthSelect"></select>
  <select id="yearSelect"></select>
</div>

<div id="summary"></div>

<div class="container">
  <div class="activities">
    <h3>Kegiatan <button onclick="addActivity()">+</button></h3>
    <ul id="activityList"></ul>
  </div>

  <div class="grid-wrapper">
    <table id="trackerTable"></table>
  </div>
</div>

<script>
const monthNames = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const monthSelect = document.getElementById('monthSelect');
const yearSelect = document.getElementById('yearSelect');
const table = document.getElementById('trackerTable');
const activityList = document.getElementById('activityList');
const summaryBox = document.getElementById('summary');

let activities = [];

/* ===== INIT ===== */
const now = new Date();
monthNames.forEach((m,i)=>{
  const o=document.createElement('option');
  o.value=i; o.textContent=m;
  monthSelect.appendChild(o);
});
monthSelect.value=now.getMonth();

for(let y=2023;y<=2035;y++){
  const o=document.createElement('option');
  o.value=y; o.textContent=y;
  yearSelect.appendChild(o);
}
yearSelect.value=now.getFullYear();

monthSelect.onchange=loadData;
yearSelect.onchange=loadData;

function storageKey(){
  return `tracker-${yearSelect.value}-${monthSelect.value}`;
}

/* ===== STORAGE ===== */
function saveData(){
  localStorage.setItem(storageKey(),JSON.stringify(activities));
}
function loadData(){
  const data=localStorage.getItem(storageKey());
  activities=data?JSON.parse(data):[];
  render();
}

/* ===== CRUD ===== */
function addActivity(){
  const name=prompt("Nama kegiatan:");
  if(!name) return;
  activities.push({name,checks:Array(31).fill(false)});
  saveData();
  render();
}
function removeActivity(i){
  if(!confirm("Hapus kegiatan?")) return;
  activities.splice(i,1);
  saveData();
  render();
}
function toggleCheck(ai,day){
  activities[ai].checks[day]=!activities[ai].checks[day];
  saveData();
}

/* ===== EVALUATION ===== */
function evaluate(){
  if(!activities.length){
    summaryBox.innerHTML="Belum ada data.";
    return;
  }

  let best=null, bestScore=-1;
  let dayStat=Array(31).fill(0);

  activities.forEach(a=>{
    const done=a.checks.filter(v=>v).length;
    if(done>bestScore){
      bestScore=done;
      best=a.name;
    }
    a.checks.forEach((v,i)=>{ if(v) dayStat[i]++; });
  });

  const worstDay=dayStat.indexOf(Math.min(...dayStat))+1;
  const productiveDays=dayStat.filter(v=>v>0).length;

  summaryBox.innerHTML=`

  🔹 Paling konsisten: <b>${b
